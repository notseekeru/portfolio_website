name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        component: [frontend, backend]
        include:
          - component: frontend
            port: 8080
            health_path: /
          - component: backend
            port: 5000
            health_path: /api/health

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU and Buildx
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Multi-Arch Image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          file: ./${{ matrix.component }}/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/portfolio-${{ matrix.component }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/portfolio-${{ matrix.component }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan shipped image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ${{ github.workspace }}/${{ matrix.component }}/.trivyignore:/.trivyignore \
            aquasec/trivy:0.41.0 image --severity HIGH,CRITICAL --exit-code 1 ${{ env.REGISTRY }}/${{ github.repository_owner }}/portfolio-${{ matrix.component }}:${{ github.sha }}

      - name: Run Smoke Test Container
        run: |
          docker run -d --name smoke-${{ matrix.component }} -p 127.0.0.1:${{ matrix.matrix.port }}:${{ matrix.port }} ${{ env.REGISTRY }}/${{ github.repository_owner }}/portfolio-${{ matrix.component }}:${{ github.sha }}

          # Health check loop
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:${{ matrix.port }}${{ matrix.health_path }} >/dev/null; then
              echo "${{ matrix.component }} health check passed."
              docker rm -f smoke-${{ matrix.component }}
              exit 0
            fi
            sleep 2
          done
          echo "${{ matrix.component }} failed smoke test."
          docker logs smoke-${{ matrix.component }}
          exit 1
