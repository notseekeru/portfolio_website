name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  gate:
    uses: ./.github/workflows/ci-pipeline.yml
    permissions:
      contents: read

  deploy-images:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
            image_suffix: portfolio-frontend
            port: 8080
            health_endpoint: /
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set image name
        run: echo "IMAGE=${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service.image_suffix }}" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build local image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          target: prod
          load: true
          push: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha

      - name: Scan image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v ${{ matrix.service.context }}/.trivyignore.yaml:/.trivyignore.yaml \
            aquasec/trivy:0.76.2 image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --ignorefile /.trivyignore.yaml \
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Run smoke container
        run: |
          docker run -d --name smoke-${{ matrix.service.name }}-${{ github.run_id }} \
            -p 127.0.0.1:${{ matrix.service.port }}:${{ matrix.service.port }} \
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Wait for service
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:${{ matrix.service.port }}${{ matrix.service.health_endpoint }} >/dev/null; then
              echo "${{ matrix.service.name }} is up"; exit 0
            fi
            sleep 1
          done
          echo "${{ matrix.service.name }} did not respond"
          docker logs smoke-${{ matrix.service.name }}-${{ github.run_id }} || true
          exit 1

      - name: Push multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          target: prod
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cleanup
        if: always()
        run: |
          docker rm -f smoke-${{ matrix.service.name }}-${{ github.run_id }} || true
          docker rmi ${{ env.IMAGE }}:${{ github.sha }} || true

      - name: Prune GHCR
        if: always()
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5
        with:
          package-name: ${{ matrix.service.image_suffix }}
          package-type: container
          min-versions-to-keep: 5

  promote-gitops:
    needs: deploy-images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Install SSH Key
        uses: shimataro/ssh-key-action@87a8f067114a8ce263df83e9ed5c849953548bc3 # v2
        with:
          key: ${{ secrets.PORTFOLIO_SSH }}
          known_hosts: "unnecessary"

      - name: Add GitHub to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Clone GitOps Repository
        run: git clone git@github.com:notseekeru/gitops.git

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@53f941b41dca13ed61874bbc6b4b6e1562877530 # v3

      - name: Update Image Tags
        run: |
          cd gitops/apps/portfolio
          kustomize edit set image ghcr.io/notseekeru/portfolio-frontend=ghcr.io/notseekeru/portfolio-frontend:${{ github.sha }}

      - name: Commit and Push Changes
        run: |
          cd gitops
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/portfolio/kustomization.yaml
          if git diff --staged --quiet; then
            echo "No changes detected. Skipping deployment commit."
          else
            git commit -m "chore(gitops): deploy portfolio images ${{ github.sha }}"
            git push origin main
          fi
