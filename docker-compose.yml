services:
  backend:
    build: ./backend
    container_name: resume_backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./backend:/app
      - /app/node_modules
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: resume_frontend
    ports:
      - "5173:5173"
    env_file:
      - ./frontend/.env
    environment:
      - BACKEND_URL=http://backend:5000
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped
