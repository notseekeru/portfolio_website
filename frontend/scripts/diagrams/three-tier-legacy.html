<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
    :root {
        --paper: #f3eee2;
        --panel: #fbf8ee;
        --line: #d5cbb6;
        --ink: #1b1812;
        --muted: #6f6757;
        --accent: #2f6b4f;
        --amber: #9a5b12;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--paper); }
    #canvas {
        position: relative;
        width: 720px;
        height: 620px;
        overflow: hidden;
        background-color: var(--paper);
        background-image: radial-gradient(circle, rgba(27, 24, 18, 0.11) 1px, transparent 1.3px);
        background-size: 24px 24px;
        font-family: Inter, "DejaVu Sans", sans-serif;
        color: var(--ink);
    }
    #wires { position: absolute; inset: 0; z-index: 1; }
    .vpc {
        position: absolute;
        left: 200px;
        top: 215px;
        width: 480px;
        height: 380px;
        border: 1.5px dashed rgba(27, 24, 18, 0.24);
        border-radius: 12px;
        z-index: 0;
    }
    .vpc-label {
        position: absolute;
        left: 216px;
        top: 203px;
        display: flex;
        align-items: center;
        gap: 7px;
        height: 24px;
        padding: 0 10px;
        background: var(--paper);
        border: 1px solid var(--line);
        border-radius: 99px;
        z-index: 3;
    }
    .vpc-label img { width: 13px; height: 13px; }
    .vpc-label .tag { font-family: "JetBrains Mono", "DejaVu Sans Mono", monospace; font-size: 10.5px; color: var(--ink); }
    .vpc-label .sub { font-size: 11px; color: var(--muted); }
    .lane {
        position: absolute;
        font-family: "JetBrains Mono", "DejaVu Sans Mono", monospace;
        font-size: 10.5px;
        color: var(--muted);
        z-index: 3;
    }

    .node {
        position: absolute;
        display: flex;
        gap: 10px;
        padding: 11px 12px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        z-index: 2;
        box-shadow: 0 1px 0 rgba(27, 24, 18, 0.04);
    }
    .node img { width: 26px; height: 26px; flex: none; }
    .node .title { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); line-height: 1.2; }
    .node .sub { margin-top: 3px; font-size: 12px; color: var(--muted); line-height: 1.3; }
    .node .sub .mono { font-family: "JetBrains Mono", "DejaVu Sans Mono", monospace; font-size: 11px; }

    .detail { font-family: "JetBrains Mono", "DejaVu Sans Mono", monospace; font-size: 10.5px; color: var(--muted); white-space: nowrap; }
    .label {
        position: absolute;
        font-family: "JetBrains Mono", "DejaVu Sans Mono", monospace;
        font-size: 10.5px;
        color: var(--muted);
        z-index: 3;
        white-space: nowrap;
    }
</style>
</head>
<body>
<div id="canvas">
    <svg id="wires" viewBox="0 0 720 620" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                <path d="M0,0 L10,5 L0,10 Z" fill="#2f6b4f" />
            </marker>
        </defs>
        <g fill="none" stroke="#2f6b4f" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
            <path d="M440,92 V130" marker-end="url(#arrow)" />
            <path d="M440,194 V253" marker-end="url(#arrow)" />
            <path d="M440,337 V352" marker-end="url(#arrow)" />
            <path d="M440,436 V491" marker-end="url(#arrow)" />
            <path d="M340,60 H130 V250" marker-end="url(#arrow)" />
            <path d="M130,330 V400" marker-end="url(#arrow)" />
        </g>
    </svg>

    <div class="vpc"></div>
    <div class="vpc-label">
        <img src="icons/VPC.png" alt="" />
        <span class="tag">VPC</span>
    </div>

    <div class="lane" style="left:280px; top:234px;">public subnet</div>
    <div class="lane" style="left:280px; top:472px;">database subnet</div>

    <div class="node" style="left:340px; top:28px; width:200px; height:64px; align-items:center;">
        <img src="icons/Client.png" alt="" />
        <div>
            <div class="title">Browser</div>
            <div class="sub">you</div>
        </div>
    </div>

    <div class="node" style="left:340px; top:130px; width:200px; height:64px; align-items:center;">
        <svg width="26" height="26" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="flex:none;"><path fill="#F38020" d="M16.5088 16.8447c.1475-.5068.0908-.9707-.1553-1.3154-.2246-.3164-.6045-.499-1.0615-.5205l-8.6592-.1123a.1559.1559 0 0 1-.1333-.0713c-.0283-.042-.0351-.0986-.021-.1553.0278-.084.1123-.1484.2036-.1562l8.7359-.1123c1.0351-.0489 2.1601-.8868 2.5537-1.9136l.499-1.3013c.0215-.0561.0293-.1128.0147-.16-.5591-2.5342-2.8184-4.3798-5.4971-4.3798-2.4805 0-4.5996 1.5864-5.3525 3.7647-.4888-.3633-1.1074-.5591-1.7676-.4893-1.1855.1191-2.1382 1.0791-2.25 2.2656-.0303.3174-.0078.624.0644.9121C3.0518 9.0396 1.5 10.7778 1.5 12.8745c0 .1826.0146.3652.0439.5449a.2266.2266 0 0 0 .2246.1904h15.0547c.1069 0 .1987-.0718.2246-.1758l.0596-.2295c.0752-.2578.0449-.5049-.0752-.6836-.2148-.3164-.5801-.499-1.0371-.5205l-5.3516-.1123a.166.166 0 0 1-.1333-.2246c.0278-.084.1123-.1484.2036-.1562l5.4287-.1123c.6226-.0293 1.2832-.5605 1.5171-1.2012l.2944-.7695c.0147-.042.0147-.084.0074-.1191-.0215-.0772-.0928-.1338-.1738-.1338Z"/></svg>
        <div>
            <div class="title">Cloudflare DNS</div>
            <div class="sub">CNAME · DNS only</div>
        </div>
    </div>

    <div class="node" style="left:280px; top:253px; width:320px; height:84px; align-items:center; justify-content:space-between;">
        <div style="display:flex; gap:10px; align-items:center;">
            <img src="icons/ELB.png" alt="" />
            <div>
                <div class="title">ALB</div>
                <div class="sub">HTTPS 443 · ACM cert</div>
            </div>
        </div>
        <span class="detail">80 → 301</span>
    </div>

    <div class="node" style="left:280px; top:352px; width:320px; height:84px; align-items:center; justify-content:space-between;">
        <div style="display:flex; gap:10px; align-items:center;">
            <img src="icons/AutoScaling.png" alt="" />
            <div>
                <div class="title">ASG</div>
                <div class="sub">1-3 × t4g.micro · nginx</div>
            </div>
        </div>
        <span class="detail">CPU 50%</span>
    </div>

    <div class="node" style="left:280px; top:491px; width:320px; height:74px; align-items:center; justify-content:space-between;">
        <div style="display:flex; gap:10px; align-items:center;">
            <img src="icons/RDS.png" alt="" />
            <div>
                <div class="title">RDS PostgreSQL</div>
                <div class="sub">multi_az = false</div>
            </div>
        </div>
        <span class="detail">gp3 · 20 GB</span>
    </div>

    <div class="node" style="left:40px; top:250px; width:180px; height:80px; align-items:center;">
        <img src="icons/CloudFront.png" alt="" />
        <div>
            <div class="title">CloudFront</div>
            <div class="sub">static assets</div>
        </div>
    </div>

    <div class="node" style="left:40px; top:400px; width:180px; height:80px; align-items:center;">
        <img src="icons/S3.png" alt="" />
        <div>
            <div class="title">S3</div>
            <div class="sub">OAC · TLS only</div>
        </div>
    </div>

    <div class="label" style="left:150px; top:44px;">static</div>
</div>
</body>
</html>
