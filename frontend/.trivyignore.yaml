# Trivy ignore policy (v0.56+ / .trivyignore.yaml)
# Dated, scoped exceptions with reachability rationale. When `expired_at`
# passes, CI re-fails until each is re-verified (fixed by base bump / dep
# upgrade, or explicitly re-accepted). Keep entries short-lived.

vulnerabilities:
  # --- npm tree: react-router (SPA; RSC/single-fetch/turbo-stream features not used) ---
  - id: CVE-2026-42211
    statement: >-
      react-router turbo-stream deserialization RCE. Not exploitable in this
      SPA (no server RSC/loader using attacker-controlled stream).
    expired_at: 2026-12-01

  - id: CVE-2026-55685
    statement: >-
      react-router DoS via route matching. No unauthenticated exposure to
      route-manipulating input.
    expired_at: 2026-12-01

  - id: CVE-2026-33245
    statement: >-
      react-router XSS in RSC redirect. RSC not used in this app.
    expired_at: 2026-12-01

  - id: CVE-2026-34077
    statement: >-
      react-router DoS in single-fetch. single-fetch not used in this app.
    expired_at: 2026-12-01

  - id: GHSA-qwww-vcr4-c8h2
    statement: >-
      react-router RSC CSRF bypass. RSC not used in this app.
    expired_at: 2026-12-01

  # --- npm tree: transitive, build/time helpers not on request path ---
  - id: CVE-2026-33671
    statement: >-
      picomatch DoS. Build-time glob matching only (devDependency), not served
      content.
    expired_at: 2026-12-01

  - id: CVE-2026-13149
    statement: >-
      brace-expansion exponential-time DoS (transitive via glob, build-only).
      Not on the request path.
    expired_at: 2026-12-01

  - id: CVE-2026-59873
    statement: >-
      node-tar DoS via crafted gzip bomb. tar is not installed in the frontend
      production npm tree. Re-verify on next full-scan.
    expired_at: 2026-12-01

  - id: CVE-2026-59874
    statement: >-
      node-tar DoS via malformed archive header. tar is not installed in the
      frontend production npm tree. Re-verify on next full-scan.
    expired_at: 2026-12-01

  # --- nginx-alpine / node base OS libraries ---
  - id: CVE-2026-14456
    purls:
      - pkg:apk/alpine/libcrypto3
      - pkg:apk/alpine/libssl3
    statement: >-
      OpenSSL QUIC-server memory-growth DoS. Static site via nginx TLS, no QUIC
      server. Re-check after base bump to openssl 3.5.8+.
    expired_at: 2026-12-01

  - id: CVE-2026-66046
    purls:
      - pkg:apk/alpine/libexpat
    statement: >-
      expat XML DoS (< 2.8.3). No untrusted XML parsing. Re-check after base
      ships expat >= 2.8.4.
    expired_at: 2026-12-01

  - id: CVE-2026-76641
    purls:
      - pkg:apk/alpine/libexpat
    statement: >-
      expat XML DoS (< 2.8.3-2). No untrusted XML parsing. Re-check after base
      ships expat >= 2.8.4.
    expired_at: 2026-12-01

  - id: CVE-2026-40200
    purls:
      - pkg:apk/alpine/musl
    statement: >-
      musl DoS in base. Reachability not established for static-file role.
      Re-check on next base bump.
    expired_at: 2026-12-01

  - id: CVE-2026-22184
    purls:
      - pkg:apk/alpine/zlib
    statement: >-
      zlib DoS in base. Re-check on next base bump.
    expired_at: 2026-12-01

  - id: CVE-2026-27135
    purls:
      - pkg:apk/alpine/nghttp2
    statement: >-
      nghttp2 DoS in base. Re-check on next base bump.
    expired_at: 2026-12-01

  - id: CVE-2026-6732
    purls:
      - pkg:apk/alpine/libxml2
    statement: >-
      libxml2 issue in base. No XML processing. Re-check on next base bump.
    expired_at: 2026-12-01

  - id: CVE-2026-33630
    purls:
      - pkg:apk/alpine/c-ares
    statement: >-
      c-ares use-after-free in query handling. No upstream fix in Alpine yet;
