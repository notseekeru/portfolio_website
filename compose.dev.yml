services:
  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: portfolio_frontend_dev
    ports:
      - "5174:5174"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped
